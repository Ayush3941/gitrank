name: Trivy Scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 2 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  TRIVY_VERSION: "0.70.0"
  TRIVY_LINUX_SHA256: "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9"
  TRIVY_DOWNLOAD_CONNECT_TIMEOUT: "30"
  TRIVY_DOWNLOAD_MAX_TIME: "120"

jobs:
  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          curl -fsSLo trivy.tar.gz \
            --connect-timeout "${TRIVY_DOWNLOAD_CONNECT_TIMEOUT}" \
            --max-time "${TRIVY_DOWNLOAD_MAX_TIME}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_LINUX_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          install -m 0755 trivy "${RUNNER_TEMP}/trivy"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan repository filesystem
        run: |
          trivy fs \
            --exit-code 1 \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig \
            --timeout 15m \
            --format sarif \
            --output trivy-fs.sarif \
            .

      - name: Upload filesystem SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  service-image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - github-ingestor
          - pr-analyzer
          - profile-service
          - scoring-engine
          - scheduler-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          curl -fsSLo trivy.tar.gz \
            --connect-timeout "${TRIVY_DOWNLOAD_CONNECT_TIMEOUT}" \
            --max-time "${TRIVY_DOWNLOAD_MAX_TIME}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_LINUX_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          install -m 0755 trivy "${RUNNER_TEMP}/trivy"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Build service container
        run: |
          docker build \
            -f gitrank/deployments/docker/Dockerfile \
            --build-arg SERVICE=${{ matrix.service }} \
            -t gitrank/${{ matrix.service }}:trivy \
            .

      - name: Scan service container image
        run: |
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig \
            --timeout 15m \
            --format sarif \
            --output trivy-image.sarif \
            gitrank/${{ matrix.service }}:trivy

      - name: Upload image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}
