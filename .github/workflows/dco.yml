name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-signoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          commits="$(git rev-list "${base_sha}..${head_sha}")"

          if [[ -z "${commits}" ]]; then
            echo "No commits to verify."
            exit 0
          fi

          failed=0
          for commit in ${commits}; do
            if ! git show -s --format=%B "${commit}" | grep -qi '^Signed-off-by: '; then
              echo "::error title=DCO sign-off missing::Commit ${commit} is missing a Signed-off-by trailer."
              failed=1
            fi
          done

          exit "${failed}"
