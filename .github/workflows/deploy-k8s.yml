name: Deploy Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Kubernetes overlay to deploy"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "OCI image tag to deploy"
        required: true
        default: "latest"
      apply:
        description: "Apply manifests to the cluster"
        required: true
        type: boolean
        default: false
      rollback:
        description: "Rollback deployments in the selected environment instead of applying manifests"
        required: true
        type: boolean
        default: false
      rollback_revision:
        description: "Optional Kubernetes rollout revision to roll back to; empty uses the previous revision"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.33.4

      - name: Validate deploy mode
        run: |
          set -eu
          if [ "${{ inputs.apply }}" = "true" ] && [ "${{ inputs.rollback }}" = "true" ]; then
            echo "apply and rollback cannot both be true" >&2
            exit 1
          fi

      - name: Render manifests
        if: inputs.rollback != true
        working-directory: gitrank
        env:
          K8S_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REGISTRY_OWNER_OVERRIDE: ${{ vars.K8S_IMAGE_REGISTRY_OWNER }}
          IMAGE_REGISTRY_OWNER_DEFAULT: ${{ github.repository_owner }}
          K8S_PUBLIC_BASE_URL_VAR: ${{ vars.K8S_PUBLIC_BASE_URL }}
          K8S_PUBLIC_BASE_URL_SECRET: ${{ secrets.K8S_PUBLIC_BASE_URL }}
          K8S_API_BASE_URL_VAR: ${{ vars.K8S_API_BASE_URL }}
          K8S_API_BASE_URL_SECRET: ${{ secrets.K8S_API_BASE_URL }}
          K8S_AUTH_COOKIE_DOMAIN_VAR: ${{ vars.K8S_AUTH_COOKIE_DOMAIN }}
          K8S_AUTH_COOKIE_DOMAIN_SECRET: ${{ secrets.K8S_AUTH_COOKIE_DOMAIN }}
          K8S_GITHUB_OAUTH_REDIRECT_URL_VAR: ${{ vars.K8S_GITHUB_OAUTH_REDIRECT_URL }}
          K8S_GITHUB_OAUTH_REDIRECT_URL_SECRET: ${{ secrets.K8S_GITHUB_OAUTH_REDIRECT_URL }}
          K8S_API_HOST_VAR: ${{ vars.K8S_API_HOST }}
          K8S_API_HOST_SECRET: ${{ secrets.K8S_API_HOST }}
          K8S_AUTH_HOST_VAR: ${{ vars.K8S_AUTH_HOST }}
          K8S_AUTH_HOST_SECRET: ${{ secrets.K8S_AUTH_HOST }}
          K8S_TLS_SECRET_NAME_VAR: ${{ vars.K8S_TLS_SECRET_NAME }}
          K8S_TLS_SECRET_NAME_SECRET: ${{ secrets.K8S_TLS_SECRET_NAME }}
          K8S_GITHUB_USER_AGENT_VAR: ${{ vars.K8S_GITHUB_USER_AGENT }}
          K8S_GITHUB_USER_AGENT_SECRET: ${{ secrets.K8S_GITHUB_USER_AGENT }}
        run: |
          set -eu
          resolve_required() {
            key=$1
            primary=$2
            secondary=$3
            value=$primary
            if [ -z "$value" ]; then
              value=$secondary
            fi
            if [ -z "$value" ]; then
              echo "$key must be configured through repository/environment variables or secrets" >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          IMAGE_REGISTRY_OWNER="${IMAGE_REGISTRY_OWNER_OVERRIDE:-$IMAGE_REGISTRY_OWNER_DEFAULT}"
          IMAGE_REGISTRY_OWNER=$(printf '%s' "$IMAGE_REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')
          export IMAGE_REGISTRY_OWNER

          export K8S_PUBLIC_BASE_URL="$(resolve_required K8S_PUBLIC_BASE_URL "$K8S_PUBLIC_BASE_URL_VAR" "$K8S_PUBLIC_BASE_URL_SECRET")"
          export K8S_API_BASE_URL="$(resolve_required K8S_API_BASE_URL "$K8S_API_BASE_URL_VAR" "$K8S_API_BASE_URL_SECRET")"
          export K8S_AUTH_COOKIE_DOMAIN="$(resolve_required K8S_AUTH_COOKIE_DOMAIN "$K8S_AUTH_COOKIE_DOMAIN_VAR" "$K8S_AUTH_COOKIE_DOMAIN_SECRET")"
          export K8S_GITHUB_OAUTH_REDIRECT_URL="$(resolve_required K8S_GITHUB_OAUTH_REDIRECT_URL "$K8S_GITHUB_OAUTH_REDIRECT_URL_VAR" "$K8S_GITHUB_OAUTH_REDIRECT_URL_SECRET")"
          export K8S_API_HOST="$(resolve_required K8S_API_HOST "$K8S_API_HOST_VAR" "$K8S_API_HOST_SECRET")"
          export K8S_AUTH_HOST="$(resolve_required K8S_AUTH_HOST "$K8S_AUTH_HOST_VAR" "$K8S_AUTH_HOST_SECRET")"
          export K8S_TLS_SECRET_NAME="$(resolve_required K8S_TLS_SECRET_NAME "$K8S_TLS_SECRET_NAME_VAR" "$K8S_TLS_SECRET_NAME_SECRET")"

          K8S_GITHUB_USER_AGENT="$K8S_GITHUB_USER_AGENT_VAR"
          if [ -z "$K8S_GITHUB_USER_AGENT" ]; then
            K8S_GITHUB_USER_AGENT="$K8S_GITHUB_USER_AGENT_SECRET"
          fi
          export K8S_GITHUB_USER_AGENT

          output_file="${RUNNER_TEMP}/rendered-k8s.yaml"
          OUTPUT_FILE="$output_file" make render-k8s-release-manifests
          cp "$output_file" "$GITHUB_WORKSPACE/rendered-k8s.yaml"
          test -s "$GITHUB_WORKSPACE/rendered-k8s.yaml"

      - name: Configure kubeconfig
        if: inputs.apply == true || inputs.rollback == true
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -eu
          test -n "$KUBE_CONFIG_B64"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        if: inputs.apply == true && inputs.rollback != true
        run: |
          set -eu
          namespace="gitrank-${{ inputs.environment }}"
          if kubectl get namespace "$namespace" >/dev/null 2>&1; then
            kubectl delete job gitrank-migrate --namespace "$namespace" --ignore-not-found
          fi
          kubectl apply -f rendered-k8s.yaml
          kubectl wait --for=condition=complete job/gitrank-migrate --namespace "$namespace" --timeout=180s
          for deployment in api-gateway auth-service github-ingestor pr-analyzer profile-service scoring-engine scheduler-worker scheduler-job-worker; do
            kubectl rollout status "deployment/${deployment}" --namespace "$namespace" --timeout=180s
          done

      - name: Rollback deployments
        if: inputs.rollback == true
        run: |
          set -eu
          namespace="gitrank-${{ inputs.environment }}"
          revision="${{ inputs.rollback_revision }}"
          for deployment in api-gateway auth-service github-ingestor pr-analyzer profile-service scoring-engine scheduler-worker scheduler-job-worker; do
            kubectl rollout history "deployment/${deployment}" --namespace "$namespace"
            if [ -n "$revision" ]; then
              kubectl rollout undo "deployment/${deployment}" --namespace "$namespace" --to-revision="$revision"
            else
              kubectl rollout undo "deployment/${deployment}" --namespace "$namespace"
            fi
            kubectl rollout status "deployment/${deployment}" --namespace "$namespace" --timeout=180s
          done
