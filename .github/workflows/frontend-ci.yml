name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check production mock imports
        run: npm run check:no-production-mocks

      - name: Check hardcoded identity literals
        run: npm run check:no-hardcoded-identities

      - name: Check conversational copy tone
        run: npm run check:copy-tone

      - name: Check sync copy policy
        run: npm run check:sync-copy-policy

      - name: Check onboarding prefetch policy
        run: npm run check:onboarding-prefetch-policy

      - name: Check client env safety
        run: npm run check:client-env-safety

      - name: Check server/client boundaries
        run: npm run check:server-boundaries

      - name: Check route cache strategy
        run: npm run check:cache-strategy

      - name: Check design token contrast
        run: npm run check:contrast

      - name: Check radius token policy
        run: npm run check:radius-tokens

      - name: Check progress accessible names
        run: npm run check:progress-names

      - name: Check image alt text
        run: npm run check:image-alt

      - name: Check role img accessible names
        run: npm run check:role-img-names

      - name: Check button accessible names
        run: npm run check:button-names

      - name: Check link accessible names
        run: npm run check:link-names

      - name: Check inline notice placeholders
        run: npm run check:inline-notice-placeholders

      - name: Check readable text token usage
        run: npm run check:readable-text

      - name: Check segmented filter consistency
        run: npm run check:segmented-filters

      - name: Check query policy
        run: npm run check:query-policy

      - name: Check unstable JSX keys
        run: npm run check:jsx-keys

      - name: Check duplicate JSX ids
        run: npm run check:jsx-ids

      - name: Check nested interactive controls
        run: npm run check:nested-interactive

      - name: Check scroll-jump APIs
        run: npm run check:scroll-jumps

      - name: Check focus without scroll
        run: npm run check:focus-without-scroll

      - name: Check media layout stability
        run: npm run check:media-stability

      - name: Check main-thread interaction guards
        run: npm run check:main-thread

      - name: Check motion budget guardrails
        run: npm run check:motion-budget

      - name: Verify V2 no-mock release gate
        run: ../gitrank/scripts/verify_v2_no_mock_release_gate.sh

      - name: Run live fixture smoke tests
        run: npm run test:smoke

      - name: Run BFF route contract tests
        run: npm run test:contracts

      - name: Run accessibility checks
        run: npm run test:a11y

      - name: Run build
        run: npm run build

      - name: Check performance budgets
        run: npm run check:perf-budgets

      - name: Analyze bundle composition
        run: npm run analyze:bundle
