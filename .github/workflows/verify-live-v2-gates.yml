name: Verify Live V2 Gates
run-name: Verify Live V2 Gates (${{ github.event_name == 'workflow_dispatch' && inputs.request_id || format('push-{0}', github.sha) }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for release-render verification"
        required: true
        type: choice
        options:
          - staging
          - production
      run_observability:
        description: "Run live observability verification"
        required: true
        type: boolean
        default: true
      run_github_controls:
        description: "Run live GitHub repository-controls verification"
        required: true
        type: boolean
        default: true
      apply_github_controls:
        description: "Apply GitHub repository controls before verification"
        required: true
        type: boolean
        default: false
      run_release_render:
        description: "Run release-manifest render verification"
        required: true
        type: boolean
        default: true
      request_id:
        description: "Optional request correlation id for scripted dispatches"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-live-v2-gates.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    env:
      LIVE_GATES_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      LIVE_GATES_RUN_OBSERVABILITY: ${{ github.event_name == 'workflow_dispatch' && inputs.run_observability || 'true' }}
      LIVE_GATES_RUN_GITHUB_CONTROLS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_github_controls || 'true' }}
      LIVE_GATES_APPLY_GITHUB_CONTROLS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_github_controls || 'false' }}
      LIVE_GATES_RUN_RELEASE_RENDER: ${{ github.event_name == 'workflow_dispatch' && inputs.run_release_render || 'true' }}
      LIVE_GATES_REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || format('push-{0}', github.sha) }}
    steps:
      - name: Log request id
        run: |
          set -eu
          echo "request_id=${LIVE_GATES_REQUEST_ID}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.4

      - name: Verify GitHub controls
        if: ${{ env.LIVE_GATES_RUN_GITHUB_CONTROLS == 'true' }}
        working-directory: gitrank
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITRANK_REPO_ADMIN_TOKEN: ${{ secrets.GITRANK_REPO_ADMIN_TOKEN }}
          GITHUB_APP_ID: ${{ secrets.GITRANK_GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITRANK_GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY_PEM: ${{ secrets.GITRANK_GITHUB_APP_PRIVATE_KEY_PEM }}
        run: |
          set -eu
          token="${GITRANK_REPO_ADMIN_TOKEN:-}"
          if [ -z "$token" ]; then
            if [ -n "${GITHUB_APP_ID:-}" ] && [ -n "${GITHUB_APP_INSTALLATION_ID:-}" ] && [ -n "${GITHUB_APP_PRIVATE_KEY_PEM:-}" ]; then
              token_file="$RUNNER_TEMP/gitrank-repo-admin-token.txt"
              TOKEN_OUTPUT_FILE="$token_file" make create-github-app-installation-token
              token="$(cat "$token_file")"
            fi
          fi

          test -n "$token"
          export GITHUB_TOKEN="$token"

          if [ "$LIVE_GATES_APPLY_GITHUB_CONTROLS" = "true" ]; then
            GITRANK_APPLY_REPOSITORY_CONTROLS=yes make apply-github-repository-controls-auto
          fi
          make verify-github-repository-controls

      - name: Verify live observability
        if: ${{ env.LIVE_GATES_RUN_OBSERVABILITY == 'true' }}
        working-directory: gitrank
        env:
          PROMETHEUS_BASE_URL: ${{ vars.PROMETHEUS_BASE_URL }}
          GRAFANA_BASE_URL: ${{ vars.GRAFANA_BASE_URL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
          EXPECTED_SERVICES: ${{ vars.OBS_EXPECTED_SERVICES }}
          EXPECTED_ALERT_GROUPS: ${{ vars.OBS_EXPECTED_ALERT_GROUPS }}
          EXPECTED_DASHBOARD_TITLES: ${{ vars.OBS_EXPECTED_DASHBOARD_TITLES }}
        run: |
          set -eu
          test -n "$PROMETHEUS_BASE_URL"
          test -n "$GRAFANA_BASE_URL"
          test -n "$GRAFANA_API_TOKEN"
          make verify-live-observability

      - name: Verify release render overrides
        if: ${{ env.LIVE_GATES_RUN_RELEASE_RENDER == 'true' }}
        working-directory: gitrank
        env:
          K8S_ENVIRONMENT: ${{ env.LIVE_GATES_ENVIRONMENT }}
          OUTPUT_FILE: ${{ runner.temp }}/rendered-k8s.yaml
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REGISTRY_OWNER_OVERRIDE: ${{ vars.K8S_IMAGE_REGISTRY_OWNER }}
          IMAGE_REGISTRY_OWNER_DEFAULT: ${{ github.repository_owner }}
          K8S_PUBLIC_BASE_URL_VAR: ${{ vars.K8S_PUBLIC_BASE_URL }}
          K8S_PUBLIC_BASE_URL_SECRET: ${{ secrets.K8S_PUBLIC_BASE_URL }}
          K8S_API_BASE_URL_VAR: ${{ vars.K8S_API_BASE_URL }}
          K8S_API_BASE_URL_SECRET: ${{ secrets.K8S_API_BASE_URL }}
          K8S_AUTH_COOKIE_DOMAIN_VAR: ${{ vars.K8S_AUTH_COOKIE_DOMAIN }}
          K8S_AUTH_COOKIE_DOMAIN_SECRET: ${{ secrets.K8S_AUTH_COOKIE_DOMAIN }}
          K8S_GITHUB_OAUTH_REDIRECT_URL_VAR: ${{ vars.K8S_GITHUB_OAUTH_REDIRECT_URL }}
          K8S_GITHUB_OAUTH_REDIRECT_URL_SECRET: ${{ secrets.K8S_GITHUB_OAUTH_REDIRECT_URL }}
          K8S_API_HOST_VAR: ${{ vars.K8S_API_HOST }}
          K8S_API_HOST_SECRET: ${{ secrets.K8S_API_HOST }}
          K8S_AUTH_HOST_VAR: ${{ vars.K8S_AUTH_HOST }}
          K8S_AUTH_HOST_SECRET: ${{ secrets.K8S_AUTH_HOST }}
          K8S_TLS_SECRET_NAME_VAR: ${{ vars.K8S_TLS_SECRET_NAME }}
          K8S_TLS_SECRET_NAME_SECRET: ${{ secrets.K8S_TLS_SECRET_NAME }}
          K8S_GITHUB_USER_AGENT_VAR: ${{ vars.K8S_GITHUB_USER_AGENT }}
          K8S_GITHUB_USER_AGENT_SECRET: ${{ secrets.K8S_GITHUB_USER_AGENT }}
        run: |
          set -eu
          resolve_required() {
            key=$1
            primary=$2
            secondary=$3
            value=$primary
            if [ -z "$value" ]; then
              value=$secondary
            fi
            if [ -z "$value" ]; then
              echo "$key must be configured through repository/environment variables or secrets" >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          IMAGE_REGISTRY_OWNER="${IMAGE_REGISTRY_OWNER_OVERRIDE:-$IMAGE_REGISTRY_OWNER_DEFAULT}"
          IMAGE_REGISTRY_OWNER=$(printf '%s' "$IMAGE_REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')
          export IMAGE_REGISTRY_OWNER

          export K8S_PUBLIC_BASE_URL="$(resolve_required K8S_PUBLIC_BASE_URL "$K8S_PUBLIC_BASE_URL_VAR" "$K8S_PUBLIC_BASE_URL_SECRET")"
          export K8S_API_BASE_URL="$(resolve_required K8S_API_BASE_URL "$K8S_API_BASE_URL_VAR" "$K8S_API_BASE_URL_SECRET")"
          export K8S_AUTH_COOKIE_DOMAIN="$(resolve_required K8S_AUTH_COOKIE_DOMAIN "$K8S_AUTH_COOKIE_DOMAIN_VAR" "$K8S_AUTH_COOKIE_DOMAIN_SECRET")"
          export K8S_GITHUB_OAUTH_REDIRECT_URL="$(resolve_required K8S_GITHUB_OAUTH_REDIRECT_URL "$K8S_GITHUB_OAUTH_REDIRECT_URL_VAR" "$K8S_GITHUB_OAUTH_REDIRECT_URL_SECRET")"
          export K8S_API_HOST="$(resolve_required K8S_API_HOST "$K8S_API_HOST_VAR" "$K8S_API_HOST_SECRET")"
          export K8S_AUTH_HOST="$(resolve_required K8S_AUTH_HOST "$K8S_AUTH_HOST_VAR" "$K8S_AUTH_HOST_SECRET")"
          export K8S_TLS_SECRET_NAME="$(resolve_required K8S_TLS_SECRET_NAME "$K8S_TLS_SECRET_NAME_VAR" "$K8S_TLS_SECRET_NAME_SECRET")"

          K8S_GITHUB_USER_AGENT="$K8S_GITHUB_USER_AGENT_VAR"
          if [ -z "$K8S_GITHUB_USER_AGENT" ]; then
            K8S_GITHUB_USER_AGENT="$K8S_GITHUB_USER_AGENT_SECRET"
          fi
          export K8S_GITHUB_USER_AGENT

          make render-k8s-release-manifests

      - name: Upload render artifact
        if: ${{ env.LIVE_GATES_RUN_RELEASE_RENDER == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-k8s-${{ env.LIVE_GATES_ENVIRONMENT }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rendered-k8s.yaml
          retention-days: 14
