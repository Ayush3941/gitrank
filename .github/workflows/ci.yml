name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitrank
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: |
            gitrank/go.work
            gitrank/**/go.sum

      - name: Sync workspace
        run: go work sync

      - name: Check formatting
        run: |
          files=$(find . -name '*.go' -not -path './vendor/*')
          test -z "$(gofmt -l $files)"

      - name: Run tests
        run: find . -name go.mod -execdir sh -c 'go test ./...' \;

      - name: Verify critical path test coverage map
        run: ./scripts/verify_critical_path_tests.sh

      - name: Run migration smoke test
        run: ./scripts/test_migrations.sh

      - name: Run critical path flow tests
        run: ./scripts/test_critical_path_flows.sh

      - name: Run builds
        run: find . -name go.mod -execdir sh -c 'go build ./...' \;

      - name: Run race detector
        run: find . -name go.mod -execdir sh -c 'go test -race ./...' \;

      - name: Run vet
        run: find . -name go.mod -execdir sh -c 'go vet ./...' \;

      - name: Audit unsafe and reflection-heavy Go code
        run: ./scripts/audit_go_safety.sh

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: find . -name go.mod -execdir sh -c 'govulncheck ./...' \;

  docker-builds:
    runs-on: ubuntu-latest
    needs: go-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: api-gateway
          - image: auth-service
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: auth-service
          - image: github-ingestor
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: github-ingestor
          - image: pr-analyzer
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: pr-analyzer
          - image: profile-service
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: profile-service
          - image: scoring-engine
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: scoring-engine
          - image: scheduler-worker
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: scheduler-worker
          - image: migrator
            dockerfile: gitrank/deployments/docker/migrator.Dockerfile
            service: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build service container
        run: |
          if [ -n "${{ matrix.service }}" ]; then
            docker build \
              -f "${{ matrix.dockerfile }}" \
              --build-arg SERVICE="${{ matrix.service }}" \
              -t "gitrank/${{ matrix.image }}:ci" \
              .
          else
            docker build \
              -f "${{ matrix.dockerfile }}" \
              -t "gitrank/${{ matrix.image }}:ci" \
              .
          fi
