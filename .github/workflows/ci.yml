name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitrank
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: |
            gitrank/go.work
            gitrank/**/go.sum

      - name: Sync workspace
        run: go work sync

      - name: Check formatting
        run: |
          files=$(find . -name '*.go' -not -path './vendor/*')
          test -z "$(gofmt -l $files)"

      - name: Run tests
        run: find . -name go.mod -execdir sh -c 'go test ./...' \;

      - name: Run race detector
        run: find . -name go.mod -execdir sh -c 'go test -race ./...' \;

      - name: Run vet
        run: find . -name go.mod -execdir sh -c 'go vet ./...' \;

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: find . -name go.mod -execdir sh -c 'govulncheck ./...' \;
