name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.29.1

      - name: Run Gitleaks
        run: |
          "$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact
