name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status_code="$(curl -sS -o /tmp/gitrank-sbom.json -w "%{http_code}" \
            --connect-timeout 30 \
            --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/dependency-graph/sbom" || true)"

          if [ "$status_code" = "200" ] || [ "$status_code" = "201" ] || [ "$status_code" = "202" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$status_code" = "404" ]; then
            async_status_code="$(curl -sS -o /tmp/gitrank-sbom-generate.json -w "%{http_code}" \
              --connect-timeout 30 \
              --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/dependency-graph/sbom/generate-report" || true)"

            if [ "$async_status_code" = "200" ] || [ "$async_status_code" = "201" ] || [ "$async_status_code" = "202" ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Dependency graph appears unavailable for ${REPOSITORY}; legacy sbom status=${status_code}, generate-report status=${async_status_code}. Enable dependency graph in repository security settings to run dependency-review-action."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph appears unavailable for ${REPOSITORY}; sbom status=${status_code}. Enable dependency graph in repository security settings to run dependency-review-action."
          fi

      - name: Dependency Review
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
