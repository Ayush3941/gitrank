name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: |
            gitrank/go.work
            gitrank/**/go.sum

      - name: Build service binaries
        working-directory: gitrank
        run: |
          set -eu
          go work sync
          mkdir -p dist
          for service in api-gateway auth-service github-ingestor pr-analyzer profile-service scoring-engine scheduler-worker; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/${service}-linux-amd64" "./services/${service}/cmd/${service}"
          done
          sha256sum dist/* > dist/SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./gitrank
          format: spdx-json
          output-file: ./gitrank/dist/gitrank.sbom.spdx.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gitrank-release-assets
          path: gitrank/dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" gitrank/dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  publish-images:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: api-gateway
          - image: auth-service
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: auth-service
          - image: github-ingestor
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: github-ingestor
          - image: pr-analyzer
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: pr-analyzer
          - image: profile-service
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: profile-service
          - image: scoring-engine
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: scoring-engine
          - image: scheduler-worker
            dockerfile: gitrank/deployments/docker/Dockerfile
            service: scheduler-worker
          - image: migrator
            dockerfile: gitrank/deployments/docker/migrator.Dockerfile
            service: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Normalize image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/gitrank-${{ matrix.image }}:${{ github.ref_name }}
