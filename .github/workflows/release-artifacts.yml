name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: |
            gitrank/go.work
            gitrank/**/go.sum

      - name: Build service binaries
        working-directory: gitrank
        run: |
          set -eu
          go work sync
          mkdir -p dist
          for service in api-gateway auth-service github-ingestor pr-analyzer profile-service scoring-engine scheduler-worker; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/${service}-linux-amd64" "./services/${service}/cmd/${service}"
          done
          sha256sum dist/* > dist/SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./gitrank
          format: spdx-json
          output-file: ./gitrank/dist/gitrank.sbom.spdx.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gitrank-release-assets
          path: gitrank/dist/*

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: gitrank/dist/*
