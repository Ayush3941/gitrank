openapi: 3.1.0
info:
  title: GitRank Gateway API
  version: 0.2.0
  description: |
    Public and authenticated HTTP surface served by `api-gateway`.

    Compatibility policy:
    - all externally supported routes are versioned under `/v1`
    - additive changes may add optional fields without a version bump
    - breaking changes require a new versioned route family and a documented migration window

    Conventions:
    - authenticated browser clients use the `gitrank_session` cookie
    - state-changing routes additionally require `X-CSRF-Token`
    - public profile responses are cacheable for a short window
    - authenticated profile and sync responses are returned with `Cache-Control: private, no-store`
    - rate limiting currently exposes `Retry-After` on `429 Too Many Requests`

    Pagination and filtering:
    - current `/v1` routes do not expose paginated collections
    - future collection routes should use `page[size]`, `page[after]`, `page[before]`, `sort`, and `filter[...]`
servers:
  - url: http://localhost:8080
tags:
  - name: Meta
  - name: Profiles
  - name: Sync
paths:
  /healthz:
    get:
      tags: [Meta]
      summary: API gateway liveness check
      operationId: getGatewayHealth
      responses:
        "200":
          description: Gateway process is healthy
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [Meta]
      summary: API gateway readiness check
      operationId: getGatewayReadiness
      responses:
        "200":
          description: Gateway and its critical upstreams are ready
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more required upstream dependencies are unavailable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /metrics:
    get:
      tags: [Meta]
      summary: Prometheus-style service metrics
      operationId: getGatewayMetrics
      responses:
        "200":
          description: Plain-text metrics exposition
          content:
            text/plain:
              schema:
                type: string
  /v1/meta/manifest:
    get:
      tags: [Meta]
      summary: Return the gateway manifest and declared dependencies
      operationId: getGatewayManifest
      responses:
        "200":
          description: Gateway manifest
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceManifest"
  /v1/meta/dependencies:
    get:
      tags: [Meta]
      summary: Return the dependency list declared in the gateway manifest
      operationId: getGatewayDependencies
      responses:
        "200":
          description: Declared upstream dependencies
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DependencySpec"
  /v1/sync:
    post:
      tags: [Sync]
      summary: Request a GitHub sync job
      description: |
        Accepts a sync request and normalizes it to one of the implemented GitHub ingestor sync routes.

        Idempotency:
        - this endpoint does not currently accept an explicit idempotency key
        - repeated requests may enqueue additional work if they fall outside downstream dedupe rules
        - webhook-driven syncs are deduplicated separately by GitHub delivery ID
      operationId: createSyncRequest
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
            examples:
              syncUser:
                summary: Sync the authenticated GitHub user
                value:
                  mode: user
              syncRepository:
                summary: Sync a repository
                value:
                  mode: repository
                  repository: openai/gpt-oss
              syncPullRequest:
                summary: Sync a pull request
                value:
                  mode: pull_request
                  repository: Ayush3941/gitrank
                  number: 42
      responses:
        "202":
          description: Sync job accepted
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          description: Invalid sync request or JSON payload
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing CSRF token
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream auth or ingestion dependency failed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/profile:
    get:
      tags: [Profiles]
      summary: Return the authenticated user's profile read model
      operationId: getMyProfile
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated profile snapshot
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateProfileResponse"
        "401":
          description: Authentication required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Profiles]
      summary: Update authenticated profile privacy controls
      operationId: updateMyProfilePrivacy
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfilePrivacyRequest"
      responses:
        "200":
          description: Updated authenticated profile snapshot
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateProfileResponse"
        "400":
          description: Invalid privacy update
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing CSRF token
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/profile/repositories/{owner}/{repo}:
    patch:
      tags: [Profiles]
      summary: Update per-repository profile visibility
      operationId: updateMyRepositoryVisibility
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositoryVisibilityRequest"
      responses:
        "200":
          description: Updated authenticated profile snapshot
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateProfileResponse"
        "400":
          description: Invalid repository visibility update
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing CSRF token
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Repository target or profile not found
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/users/{handle}:
    get:
      tags: [Profiles]
      summary: Return the public profile read model
      description: |
        Public profile summaries are intentionally directional rather than absolute. Strength summaries and skill areas
        should be read as recent evidence-backed signals from the snapshot window, not absolute claims of expertise.
      operationId: getPublicProfile
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile snapshot
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              $ref: "#/components/headers/PublicProfileCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfileResponse"
        "404":
          description: Profile not found or public visibility disabled
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/users/{handle}/card:
    get:
      tags: [Profiles]
      summary: Return shareable public profile card data
      operationId: getPublicProfileCard
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shareable public profile card
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              $ref: "#/components/headers/PublicProfileCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareableProfileCard"
        "404":
          description: Profile not found or public visibility disabled
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  headers:
    XRequestID:
      description: Request correlation ID injected at the gateway edge.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying a rate-limited request.
      schema:
        type: integer
        minimum: 1
    PublicProfileCacheControl:
      description: Public cache policy applied to public profile responses.
      schema:
        type: string
        example: public, max-age=60, stale-while-revalidate=300
    PrivateNoStoreCacheControl:
      description: Private no-store cache policy applied to authenticated and sync responses.
      schema:
        type: string
        example: private, no-store
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gitrank_session
      description: Session cookie issued by `auth-service`.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token derived from the current session.
  schemas:
    ComponentCheck:
      type: object
      properties:
        status:
          type: string
        details:
          type: string
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
        environment:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentCheck"
    RouteSpec:
      type: object
      required: [method, path, summary, status]
      properties:
        method:
          type: string
        path:
          type: string
        summary:
          type: string
        status:
          type: string
    DependencySpec:
      type: object
      required: [name, kind, purpose, critical, status]
      properties:
        name:
          type: string
        kind:
          type: string
        base_url:
          type: string
        purpose:
          type: string
        auth:
          type: string
        critical:
          type: boolean
        status:
          type: string
    ServiceManifest:
      type: object
      required: [service, description, version, routes]
      properties:
        service:
          type: string
        description:
          type: string
        version:
          type: string
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteSpec"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencySpec"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    SyncRequest:
      type: object
      properties:
        user:
          type: string
          description: GitHub login to sync when `mode=user`.
        repository:
          type: string
          description: `owner/repo` identifier for repository, PR, review, issue, and commit sync modes.
        mode:
          type: string
          enum: [installation, user, repository, pull_request, review, issue, commit]
        installation_id:
          type: integer
          format: int64
        number:
          type: integer
        sha:
          type: string
    SyncResponse:
      type: object
      required: [status, accepted_at]
      properties:
        status:
          type: string
          example: queued
        job_id:
          type: string
        correlation_id:
          type: string
        accepted_at:
          type: string
          format: date-time
    PublicProfileSummary:
      type: object
      required: [handle, display_name, total_xp, strength_summary, badges_earned, merged_pull_requests, updated_at]
      properties:
        handle:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        bio:
          type: string
        total_xp:
          type: integer
        strength_summary:
          type: string
          description: Directional, evidence-backed summary of current contribution strengths.
        top_skills:
          type: array
          items:
            type: string
        badges_earned:
          type: integer
        merged_pull_requests:
          type: integer
        updated_at:
          type: string
          format: date-time
    ProfileTimeWindow:
      type: object
      required: [label, bucket, start_at, end_at]
      properties:
        label:
          type: string
          example: Last 6 weeks
        bucket:
          type: string
          example: week
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
    ProfileTimelinePoint:
      type: object
      required: [bucket_start, bucket_end, delta_xp, total_xp]
      properties:
        bucket_start:
          type: string
          format: date-time
        bucket_end:
          type: string
          format: date-time
        delta_xp:
          type: integer
        total_xp:
          type: integer
    ProfileTimeline:
      type: object
      required: [window, points, updated_at]
      properties:
        window:
          $ref: "#/components/schemas/ProfileTimeWindow"
        points:
          type: array
          items:
            $ref: "#/components/schemas/ProfileTimelinePoint"
        updated_at:
          type: string
          format: date-time
    SkillAreaView:
      type: object
      required: [key, total_xp, percentage]
      properties:
        key:
          type: string
        total_xp:
          type: integer
        percentage:
          type: number
          format: double
        summary:
          type: string
    TopRepositoryView:
      type: object
      required: [full_name, owner, name, total_xp, contribution_count, merged_pull_requests, last_contribution_at, visibility]
      properties:
        full_name:
          type: string
        owner:
          type: string
        name:
          type: string
        total_xp:
          type: integer
        contribution_count:
          type: integer
        merged_pull_requests:
          type: integer
        primary_skill:
          type: string
        last_contribution_at:
          type: string
          format: date-time
        visibility:
          type: string
          enum: [public, hidden]
    ProfileLevelView:
      type: object
      required: [label, current_level, current_xp, next_level_xp, rank_tier]
      properties:
        label:
          type: string
        current_level:
          type: integer
        current_xp:
          type: integer
        next_level_xp:
          type: integer
        rank_tier:
          type: string
    BadgeView:
      type: object
      required: [key, name, awarded_at]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        awarded_at:
          type: string
          format: date-time
        evidence:
          type: object
          additionalProperties: true
    PullRequestReference:
      type: object
      required: [repository, number]
      properties:
        repository:
          type: string
        number:
          type: integer
        title:
          type: string
    ScoreHistoryEntry:
      type: object
      required: [event_id, event_type, delta_xp, created_at]
      properties:
        event_id:
          type: string
        event_type:
          type: string
        delta_xp:
          type: integer
        created_at:
          type: string
          format: date-time
        pull_request:
          $ref: "#/components/schemas/PullRequestReference"
        explanation:
          type: array
          items:
            type: string
    ProfilePrivacySettings:
      type: object
      required: [public_profile_enabled, show_exact_prs, show_ai_summaries, show_leaderboard_participation]
      properties:
        public_profile_enabled:
          type: boolean
        show_exact_prs:
          type: boolean
        show_ai_summaries:
          type: boolean
        show_leaderboard_participation:
          type: boolean
    RepositoryVisibilityView:
      type: object
      required: [full_name, visibility]
      properties:
        full_name:
          type: string
        visibility:
          type: string
          enum: [public, hidden]
        reason:
          type: string
    ProfileStaleness:
      type: object
      required: [refreshed_at, stale_after, source_watermark, is_stale, partial_profile_available]
      properties:
        refreshed_at:
          type: string
          format: date-time
        stale_after:
          type: string
          format: date-time
        source_watermark:
          type: string
          format: date-time
        is_stale:
          type: boolean
        partial_profile_available:
          type: boolean
    ShareableProfileCard:
      type: object
      required: [handle, display_name, headline, level, total_xp, refreshed_at]
      properties:
        handle:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        headline:
          type: string
        level:
          $ref: "#/components/schemas/ProfileLevelView"
        total_xp:
          type: integer
        top_skills:
          type: array
          items:
            type: string
        badge_keys:
          type: array
          items:
            type: string
        refreshed_at:
          type: string
          format: date-time
    PublicProfileResponse:
      type: object
      required: [summary, level, timeline, share_card, staleness]
      properties:
        summary:
          $ref: "#/components/schemas/PublicProfileSummary"
        top_skill_areas:
          type: array
          items:
            $ref: "#/components/schemas/SkillAreaView"
        top_repositories:
          type: array
          items:
            $ref: "#/components/schemas/TopRepositoryView"
        level:
          $ref: "#/components/schemas/ProfileLevelView"
        badges:
          type: array
          items:
            $ref: "#/components/schemas/BadgeView"
        score_history:
          type: array
          items:
            $ref: "#/components/schemas/ScoreHistoryEntry"
        timeline:
          $ref: "#/components/schemas/ProfileTimeline"
        share_card:
          $ref: "#/components/schemas/ShareableProfileCard"
        staleness:
          $ref: "#/components/schemas/ProfileStaleness"
    PrivateProfileResponse:
      type: object
      required: [summary, level, timeline, privacy, share_card, staleness]
      properties:
        summary:
          $ref: "#/components/schemas/PublicProfileSummary"
        top_skill_areas:
          type: array
          items:
            $ref: "#/components/schemas/SkillAreaView"
        top_repositories:
          type: array
          items:
            $ref: "#/components/schemas/TopRepositoryView"
        level:
          $ref: "#/components/schemas/ProfileLevelView"
        badges:
          type: array
          items:
            $ref: "#/components/schemas/BadgeView"
        timeline:
          $ref: "#/components/schemas/ProfileTimeline"
        score_history:
          type: array
          items:
            $ref: "#/components/schemas/ScoreHistoryEntry"
        privacy:
          $ref: "#/components/schemas/ProfilePrivacySettings"
        repository_visibility:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryVisibilityView"
        share_card:
          $ref: "#/components/schemas/ShareableProfileCard"
        staleness:
          $ref: "#/components/schemas/ProfileStaleness"
    UpdateProfilePrivacyRequest:
      type: object
      properties:
        public_profile_enabled:
          type: boolean
        show_exact_prs:
          type: boolean
        show_ai_summaries:
          type: boolean
        show_leaderboard_participation:
          type: boolean
    UpdateRepositoryVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: string
          enum: [public, hidden]
        reason:
          type: string
