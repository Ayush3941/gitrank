  namespace: gitrank-production
spec:
  rules:
  - host: api.gitrank.dev
    http:
      paths:
      - backend:
          service:
            name: api-gateway
            port:
              name: http
        path: /
        pathType: Prefix
  - host: auth.gitrank.dev
    http:
      paths:
      - backend:
          service:
            name: auth-service
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - api.gitrank.dev
    - auth.gitrank.dev
    secretName: gitrank-prod-tls
