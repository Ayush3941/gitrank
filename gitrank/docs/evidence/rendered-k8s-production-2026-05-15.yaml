apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: gitrank-migrate
    app.kubernetes.io/part-of: gitrank
  name: gitrank-migrate
  namespace: gitrank-production
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitrank-migrate
        app.kubernetes.io/part-of: gitrank
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: HOME
          value: /tmp
        envFrom:
        - configMapRef:
            name: gitrank-runtime-config
        - secretRef:
            name: gitrank-runtime-secrets
        image: ghcr.io/ayush3941/gitrank-migrator:89bbbbc
        imagePullPolicy: IfNotPresent
        name: migrate
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: gitrank
      volumes:
      - emptyDir: {}
        name: tmp
  ttlSecondsAfterFinished: 86400
