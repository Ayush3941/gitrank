apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitrank-prometheus
  labels:
    app.kubernetes.io/name: gitrank-prometheus
    app.kubernetes.io/part-of: gitrank
    app.kubernetes.io/component: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitrank-prometheus
  labels:
    app.kubernetes.io/name: gitrank-prometheus
    app.kubernetes.io/part-of: gitrank
    app.kubernetes.io/component: observability
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitrank-prometheus
  labels:
    app.kubernetes.io/name: gitrank-prometheus
    app.kubernetes.io/part-of: gitrank
    app.kubernetes.io/component: observability
subjects:
  - kind: ServiceAccount
    name: gitrank-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitrank-prometheus
