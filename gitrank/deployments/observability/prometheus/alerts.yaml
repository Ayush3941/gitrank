groups:
  - name: gitrank-platform
    rules:
      - alert: GitRankSyncBacklogHigh
        expr: gitrank_queue_depth{service="github-ingestor",queue="github-sync"} > 100
        for: 15m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: GitHub sync backlog is growing
          description: The github-ingestor queue depth has been above 100 for 15 minutes.
          runbook: docs/runbooks/sync-backlog.md

      - alert: GitRankSchedulerDeadLettersPresent
        expr: gitrank_scheduler_dead_letters{service="scheduler-worker",queue="github-sync-dead"} > 0
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: Scheduler dead letters are present
          description: The scheduler worker has dead-lettered jobs that need review or replay.
          runbook: docs/runbooks/sync-backlog.md

      - alert: GitRankWebhookFailuresPresent
        expr: gitrank_webhook_deliveries_tracked{service="github-ingestor",status="failed"} > 0
        for: 10m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: GitHub webhook deliveries are failing
          description: The ingestor has tracked failed webhook deliveries for at least 10 minutes.
          runbook: docs/runbooks/sync-backlog.md

      - alert: GitRankAuthServiceErrorsHigh
        expr: sum(rate(gitrank_http_errors_total{service="auth-service",status_class="5xx"}[10m])) > 0.05
        for: 10m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: Auth service 5xx rate is elevated
          description: The auth-service is returning more than 0.05 5xx responses per second over 10 minutes.
          runbook: docs/runbooks/auth-failures.md

      - alert: GitRankGitHubRateLimitLow
        expr: gitrank_github_rate_limit_remaining{service="auth-service",resource="core"} < 200
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: GitHub core rate limit is running low
          description: auth-service observed fewer than 200 remaining GitHub core API requests for at least 5 minutes.
          runbook: docs/runbooks/auth-failures.md

      - alert: GitRankScoringServiceErrorsHigh
        expr: sum(rate(gitrank_http_errors_total{service="scoring-engine",status_class="5xx"}[10m])) > 0.02
        for: 10m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: Scoring service 5xx rate is elevated
          description: The scoring-engine is returning 5xx responses for score requests and may be unable to compute contribution scores.
          runbook: docs/runbooks/scoring-failures.md

      - alert: GitRankSuspiciousScoresSpike
        expr: rate(gitrank_score_suspicious_total{service="scoring-engine"}[15m]) > 0.5
        for: 15m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: Suspicious score classifications are spiking
          description: The scoring-engine is flagging more than 0.5 suspicious results per second over 15 minutes.
          runbook: docs/runbooks/scoring-failures.md
