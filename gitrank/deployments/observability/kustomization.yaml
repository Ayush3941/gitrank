apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitrank
resources:
  - k8s/rbac.yaml
  - k8s/prometheus.yaml
  - k8s/grafana.yaml
configMapGenerator:
  - name: gitrank-prometheus-config
    files:
      - prometheus.yml=k8s/prometheus.yml
  - name: gitrank-prometheus-rules
    files:
      - alerts.yaml=prometheus/alerts.yaml
  - name: gitrank-grafana-datasources
    files:
      - datasource.yaml=k8s/grafana-datasources.yaml
  - name: gitrank-grafana-dashboard-providers
    files:
      - dashboards.yaml=k8s/grafana-dashboards.yaml
  - name: gitrank-grafana-dashboards
    files:
      - gitrank-overview-dashboard.json=grafana/gitrank-overview-dashboard.json
      - gitrank-slo-dashboard.json=grafana/gitrank-slo-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: gitrank
    app.kubernetes.io/component: observability
