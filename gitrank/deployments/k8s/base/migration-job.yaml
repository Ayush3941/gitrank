apiVersion: batch/v1
kind: Job
metadata:
  name: gitrank-migrate
  labels:
    app.kubernetes.io/name: gitrank-migrate
    app.kubernetes.io/part-of: gitrank
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitrank-migrate
        app.kubernetes.io/part-of: gitrank
    spec:
      serviceAccountName: gitrank
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: gitrank-migrator:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gitrank-runtime-config
            - secretRef:
                name: gitrank-runtime-secrets
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
