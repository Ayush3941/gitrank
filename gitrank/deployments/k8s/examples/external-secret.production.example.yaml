apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitrank-runtime-secrets
  namespace: gitrank-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: replace-with-your-secret-store
  target:
    name: gitrank-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: gitrank/production/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: gitrank/production/redis-url
    - secretKey: GITRANK_SESSION_SECRET
      remoteRef:
        key: gitrank/production/session-secret
    - secretKey: GITRANK_JWT_SIGNING_KEY
      remoteRef:
        key: gitrank/production/jwt-signing-key
    - secretKey: GITHUB_TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: gitrank/production/github-token-encryption-key
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: gitrank/production/github-client-id
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: gitrank/production/github-client-secret
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: gitrank/production/github-webhook-secret
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: gitrank/production/openai-api-key
    - secretKey: GRAFANA_ADMIN_USER
      remoteRef:
        key: gitrank/production/grafana-admin-user
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: gitrank/production/grafana-admin-password
