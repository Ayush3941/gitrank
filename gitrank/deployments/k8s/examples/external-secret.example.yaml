apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitrank-runtime-secrets
  namespace: gitrank
  annotations:
    gitrank.io/example: replace `replace-environment` with `staging` or `production`; do not reuse one remote secret path across environments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: replace-with-your-secret-store
  target:
    name: gitrank-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: gitrank/replace-environment/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: gitrank/replace-environment/redis-url
    - secretKey: GITRANK_SESSION_SECRET
      remoteRef:
        key: gitrank/replace-environment/session-secret
    - secretKey: GITRANK_PREVIOUS_SESSION_SECRETS
      remoteRef:
        key: gitrank/replace-environment/previous-session-secrets
    - secretKey: GITRANK_JWT_SIGNING_KEY
      remoteRef:
        key: gitrank/replace-environment/jwt-signing-key
    - secretKey: GITHUB_TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: gitrank/replace-environment/github-token-encryption-key
    - secretKey: GITHUB_PREVIOUS_TOKEN_ENCRYPTION_KEYS
      remoteRef:
        key: gitrank/replace-environment/github-previous-token-encryption-keys
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: gitrank/replace-environment/github-client-id
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: gitrank/replace-environment/github-client-secret
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: gitrank/replace-environment/github-webhook-secret
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: gitrank/replace-environment/gemini-api-key
    - secretKey: GRAFANA_ADMIN_USER
      remoteRef:
        key: gitrank/replace-environment/grafana-admin-user
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: gitrank/replace-environment/grafana-admin-password
