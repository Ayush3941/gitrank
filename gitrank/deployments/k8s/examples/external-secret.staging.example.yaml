apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitrank-runtime-secrets
  namespace: gitrank-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: replace-with-your-secret-store
  target:
    name: gitrank-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: gitrank/staging/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: gitrank/staging/redis-url
    - secretKey: GITRANK_SESSION_SECRET
      remoteRef:
        key: gitrank/staging/session-secret
    - secretKey: GITRANK_PREVIOUS_SESSION_SECRETS
      remoteRef:
        key: gitrank/staging/previous-session-secrets
    - secretKey: GITRANK_JWT_SIGNING_KEY
      remoteRef:
        key: gitrank/staging/jwt-signing-key
    - secretKey: GITHUB_TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: gitrank/staging/github-token-encryption-key
    - secretKey: GITHUB_PREVIOUS_TOKEN_ENCRYPTION_KEYS
      remoteRef:
        key: gitrank/staging/github-previous-token-encryption-keys
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: gitrank/staging/github-client-id
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: gitrank/staging/github-client-secret
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: gitrank/staging/github-webhook-secret
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: gitrank/staging/openai-api-key
    - secretKey: GRAFANA_ADMIN_USER
      remoteRef:
        key: gitrank/staging/grafana-admin-user
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: gitrank/staging/grafana-admin-password
