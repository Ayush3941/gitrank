apiVersion: v1
kind: Secret
metadata:
  name: gitrank-runtime-secrets
  namespace: gitrank
type: Opaque
stringData:
  DATABASE_URL: postgres://replace-me
  REDIS_URL: redis://replace-me
  GITRANK_SESSION_SECRET: replace-with-long-random-secret
  GITRANK_PREVIOUS_SESSION_SECRETS: ""
  GITRANK_JWT_SIGNING_KEY: replace-with-long-random-signing-key
  GITHUB_TOKEN_ENCRYPTION_KEY: replace-with-32-byte-base64-key
  GITHUB_PREVIOUS_TOKEN_ENCRYPTION_KEYS: ""
  GITHUB_CLIENT_ID: replace-me
  GITHUB_CLIENT_SECRET: replace-me
  GITHUB_WEBHOOK_SECRET: replace-me
  OPENAI_API_KEY: replace-me
  GRAFANA_ADMIN_USER: replace-me
  GRAFANA_ADMIN_PASSWORD: replace-with-long-random-password
