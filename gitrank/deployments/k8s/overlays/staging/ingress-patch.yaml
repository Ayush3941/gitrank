apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitrank
spec:
  tls:
    - hosts:
        - api.staging.gitrank.example.com
        - auth.staging.gitrank.example.com
      secretName: gitrank-staging-tls
  rules:
    - host: api.staging.gitrank.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
    - host: auth.staging.gitrank.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  name: http
